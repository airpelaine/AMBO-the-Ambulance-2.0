<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AMBO - Automated Module-Based Outcome</title>
    <style>
        :root { --primary-blue: #00d4ff; --emergency-red: #ff3e3e; --warning-gold: #ffcc00; --success-green: #27ae60; --bg-dark: #0f0f0f; }
        body { display: flex; justify-content: center; align-items: flex-start; height: 100vh; margin: 0; background: var(--bg-dark); font-family: 'Segoe UI', sans-serif; color: white; overflow: hidden; touch-action: none; padding-top: 15px; }
        .container { position: relative; display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 420px; margin-top: 60px; }
        canvas { background: #1a1a1a; border: 3px solid #333; border-radius: 16px; width: 92%; height: auto; box-shadow: 0 0 40px rgba(0,212,255,0.15); }
        .hud-header-tag { position: absolute; top: -50px; left: 4%; right: 4%; display: flex; justify-content: space-between; align-items: center; font-size: 11px; background: rgba(30, 30, 30, 0.9); padding: 8px 12px; border-radius: 8px; border: 1px solid #444; }
        .stats-bar { width: 92%; display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 12px; font-weight: bold; }
        .stat-red { color: var(--emergency-red); } .stat-blue { color: var(--primary-blue); }
        #mainOverlay { position: absolute; top: 0px; left: 4%; right: 4%; bottom: 80px; background: rgba(10, 10, 10, 0.96); border: 2px solid var(--primary-blue); border-radius: 20px; display: flex; flex-direction: column; padding: 20px; z-index: 100; backdrop-filter: blur(8px); }
        .story-header { font-size: 18px; color: var(--emergency-red); font-weight: 900; text-align: center; margin-bottom: 10px; text-transform: uppercase; }
        .story-text { font-size: 13px; color: #eee; margin-bottom: 15px; line-height: 1.5; text-align: center; background: rgba(255,255,255,0.05); padding: 15px; border-radius: 12px; border-left: 4px solid var(--primary-blue); min-height: 80px; }
        .option-btn { background: #252525; text-align: left; margin-bottom: 8px; padding: 12px; border-radius: 10px; font-size: 12px; border: 1px solid #444; width: 100%; color: white; cursor: pointer; }
        .option-btn:hover { background: #333; }
        #feedbackMsg { font-weight: bold; text-align: center; margin-bottom: 10px; font-size: 16px; display: none; padding: 8px; border-radius: 8px; }
        .correct { color: var(--success-green); background: rgba(39, 174, 96, 0.1); }
        .wrong { color: var(--emergency-red); background: rgba(255, 62, 62, 0.1); }
        .form-group { margin-bottom: 12px; text-align: left; width: 100%; }
        .form-group label { display: block; font-size: 10px; color: var(--primary-blue); margin-bottom: 5px; text-transform: uppercase; }
        .form-group input, .form-group select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #111; color: white; box-sizing: border-box; font-size: 14px; }
        .ambo-avatar { width: 50px; height: 80px; margin: 0 auto 15px; position: relative; background: #fff; border-radius: 4px; border: 2px solid #ccc; }
        .ambo-avatar::after { content: ''; position: absolute; top: 35px; left: 0; width: 100%; height: 12px; background: var(--emergency-red); }
        .siren-light { position: absolute; top: -8px; left: 50%; transform: translateX(-50%); width: 34px; height: 8px; border-radius: 4px; animation: flickerSiren 0.3s infinite alternate; }
        @keyframes flickerSiren { 0% { background: var(--emergency-red); box-shadow: 0 0 15px var(--emergency-red); } 100% { background: var(--primary-blue); box-shadow: 0 0 15px var(--primary-blue); } }
        .progress-container { width: 92%; height: 8px; background: #222; border-radius: 10px; margin-top: 15px; border: 1px solid #333; overflow: hidden; }
        #progressBar { width: 0%; height: 100%; background: linear-gradient(90deg, var(--primary-blue), #00ff88); transition: width 0.4s ease; }
        .game-btn { padding: 16px 24px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; color: white; text-transform: uppercase; letter-spacing: 1px; }
        .btn-green { background: var(--success-green); width: 100%; margin-top: 10px; box-shadow: 0 4px 15px rgba(39, 174, 96, 0.3); }
        .reset-btn { background: none; border: none; color: #666; margin-top: 10px; font-size: 11px; cursor: pointer; text-decoration: underline; font-weight: bold; }
        .result-data-box { background: rgba(255,255,255,0.05); border: 1px solid #333; border-radius: 12px; padding: 15px; margin: 15px 0; width: 85%; }
    </style>
</head>
<body>

<div class="container">
    <div class="hud-header-tag"><span id="hudModuleTitle">CLINICAL SERVICES</span><span id="hudPlayerID">ID: ---</span></div>
    <div class="stats-bar">
        <div class="stat-item stat-red">💓 STABILITY: <span id="stabilityDisplay">0</span>%</div>
        <div class="stat-item stat-blue">🏁 <span id="dist">0</span>m</div>
    </div>
    <canvas id="game" width="360" height="580"></canvas>
    <div id="mainOverlay">
        <div id="screenStart" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center;">
            <div class="ambo-avatar"><div class="siren-light"></div></div>
            <h1 style="margin: 0; color: #fff; font-size: 28px;">🚑 AMBO</h1>
            <p style="color: var(--warning-gold); font-size: 11px; margin-bottom: 30px;">Automated Module-Based Outcome</p>
            <button class="game-btn btn-green" id="startMissionBtn" onclick="showScreen('screenDetails')" disabled>LOADING CLOUD CACHE...</button>
        </div>
        <div id="screenDetails" style="display: none; flex-direction: column; justify-content: center; height: 100%;">
            <div class="story-header">DEPLOYMENT</div>
            <div class="form-group">
                <label>Training Module</label>
                <select id="trainingModule">
                    <option value="emergency">Emergency Care</option>
                    <option value="ambulatory">Ambulatory Care</option>
                    <option value="basic">Basic Navigation</option>
                    <option value="acute_care">Acute Care</option>
                    <option value="acute_surgical">Acute/Surgical Care</option>
                    <option value="shiftmanager">Shift Manager Roles</option>
                    <option value="discharge">Discharge Officer</option>
                </select>
            </div>
            <div class="form-group"><label>Assigned Site</label><select id="playerSite"><option value="QC">St. Luke's - QC</option><option value="GC">St. Luke's - GC</option></select></div>
            <div class="form-group"><label>Player Number</label><input type="number" id="playerNum" inputmode="numeric" placeholder="Enter employee number"></div>
            <button class="game-btn btn-green" onclick="validateDetails()">CONFIRM DISPATCH</button>
        </div>
        <div id="screenBriefing" style="display: none; flex-direction: column; justify-content: center; height: 100%;">
            <div class="ambo-avatar"><div class="siren-light"></div></div>
            <div class="story-header">🚨 MISSION BRIEFING 🚨</div>
            <div id="storyContent" class="story-text"></div>
            <button id="storyBtn" class="game-btn btn-green" onclick="nextStory()">CONTINUE</button>
        </div>
        <div id="screenQuiz" style="display: none; flex-direction: column; justify-content: center; height: 100%;">
            <div id="feedbackMsg"></div>
            <div id="qText" style="font-size: 14px; margin-bottom: 10px; font-weight: bold; line-height: 1.4;"></div>
            <div id="optionsContainer"></div>
        </div>
        <div id="screenResult" style="display: none; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center;">
            <div class="story-header" style="color: var(--success-green); font-size: 22px;">MISSION ACCOMPLISHED!</div>
            <div class="result-data-box">
                <div id="finalPlayerDisplay" style="color: var(--primary-blue); font-size: 16px; font-weight: bold; margin-bottom: 10px;">ID: ---</div>
                <div style="display: flex; justify-content: space-around;">
                    <div><div id="finalStability" style="font-size: 32px; font-weight: bold; color: #fff;">0%</div><p style="font-size: 9px; color: #aaa; margin:0;">STABILITY</p></div>
                    <div><div id="finalSync" style="font-size: 32px; font-weight: bold; color: var(--warning-gold);">0/0</div><p style="font-size: 9px; color: #aaa; margin:0;">SYSTEM SYNC</p></div>
                </div>
            </div>
            <button id="genBtn" class="game-btn btn-green" onclick="processValidation()">VALIDATE & SYNC</button>
        </div>
    </div>
    <div class="progress-container"><div id="progressBar"></div></div>
    <button class="reset-btn" onclick="location.reload()">RESET SIMULATION</button>
</div>

<div id="trackingBufferChannel" style="display: none;"></div>

<script>
    // 🌟 LINKED TO YOUR EXACT CSV DIRECT DOWNLOAD LINK
    const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRfU0TSbaFOFzD_TNDaoHm_4xyxhl4YkaNLtTHd40t4rMlzbYxnxmwbOFgd1mQMurxFu5kerZT7ufM8/pub?output=csv";

    const canvas = document.getElementById('game'), ctx = canvas.getContext('2d');
    const distText = document.getElementById('dist'), stabText = document.getElementById('stabilityDisplay');
    const hudPlayerID = document.getElementById('hudPlayerID'), hudModuleTitle = document.getElementById('hudModuleTitle');
    const progBar = document.getElementById('progressBar'), mainOverlay = document.getElementById('mainOverlay'), feedbackMsg = document.getElementById('feedbackMsg');

    let distance = 0, stability = 0, currentQuestionIndex = 0, syncScore = 0;
    let isPaused = true, inQuiz = false, gameStarted = false, arriving = false;
    let roadOffset = 0, spawnTimer = 0, hospitalY = -600, nextMilestone = 1000, firstAttempt = true, batchCount = 0;
    let playerIDValue = "", currentQuestionSet = [], questionLogs = [], firstChoiceLogs = [], storyPart = 0;
    let finalLoggedStability = 0, finalLoggedSyncScore = 0, allQuestions = {}; 

    async function initializeCloudAssets() {
        try {
            const resp = await fetch(csvUrl);
            const csvText = await resp.text();
            parseCloudCSV(csvText);
            const startBtn = document.getElementById('startMissionBtn');
            startBtn.innerText = "START MISSION";
            startBtn.disabled = false;
        } catch(e) {
            console.error("Asset matrix deployment connection exception:", e);
            alert("Error: Unable to securely pull validation assets. Check connection parameters.");
        }
    }

    function parseCloudCSV(text) {
        const lines = text.split(/\r?\n/);
        const mappedData = {};
        for (let i = 1; i < lines.length; i++) {
            let row = lines[i];
            if (!row.trim()) continue;
            
            let processLine = row.match(/(".*?"|[^",\r\n]+)(?=\s*,|\s*$|\r|$)/g) || [];
            if(processLine.length < 7) continue;
            
            let scrubbedCells = processLine.map(v => v.replace(/^"|"$/g, '').trim());
            let moduleKey = scrubbedCells[0];
            
            let questionObj = {
                q: scrubbedCells[1],
                a: [scrubbedCells[2], scrubbedCells[3], scrubbedCells[4], scrubbedCells[5]].filter(Boolean),
                correct: parseInt(scrubbedCells[6])
            };
            if(!mappedData[moduleKey]) mappedData[moduleKey] = [];
            mappedData[moduleKey].push(questionObj);
        }
        allQuestions = mappedData;
    }

    const ambulance = { x: 162, y: 480, w: 36, h: 70, speed: 7 };
    let traffic = []; const keys = {};
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    canvas.addEventListener('touchmove', (e) => {
        if (isPaused || arriving) return;
        const rect = canvas.getBoundingClientRect();
        const touchX = (e.touches[0].clientX - rect.left) * (canvas.width / rect.width);
        ambulance.x = touchX - (ambulance.w / 2);
        if (ambulance.x < 15) ambulance.x = 15;
        if (ambulance.x > canvas.width - ambulance.w - 15) ambulance.x = canvas.width - ambulance.w - 15;
        e.preventDefault();
    }, { passive: false });

    function getBriefingText() { return [`"System online. <b>Hello, Pilot ${playerIDValue}!</b>"`,`"Avoid collisions! Every impact results in a <b>-100m deduction</b>."`,`"Only the <b>first choice</b> counts toward your Sync score."`,`"Keep the data stream stable. Deploying now..."`]; }

    function showScreen(id) {
        ['screenStart', 'screenDetails', 'screenBriefing', 'screenQuiz', 'screenResult'].forEach(s => document.getElementById(s).style.display = 'none');
        document.getElementById(id).style.display = 'flex';
    }

    function validateDetails() {
        const val = document.getElementById('playerNum').value;
        const modKey = document.getElementById('trainingModule').value;
        if (!val) { alert("Enter employee number"); return; }
        playerIDValue = val;
        hudPlayerID.innerText = "ID: " + val;
        hudModuleTitle.innerText = document.getElementById('trainingModule').options[document.getElementById('trainingModule').selectedIndex].text.toUpperCase();
        
        currentQuestionSet = allQuestions[modKey] || [];
        if (currentQuestionSet.length === 0) {
            alert("No configuration vectors found matching selected assignment module targets.");
            return;
        }
        
        questionLogs = []; 
        firstChoiceLogs = [];
        storyPart = 0; showStoryPart(); showScreen('screenBriefing');
    }

    function showStoryPart() {
        const texts = getBriefingText();
        document.getElementById('storyContent').innerHTML = texts[storyPart];
        document.getElementById('storyBtn').innerText = storyPart === texts.length - 1 ? "🚀 DEPLOY AMBO" : "NEXT";
    }

    function nextStory() {
        const texts = getBriefingText();
        if (storyPart < texts.length - 1) { storyPart++; showStoryPart(); } 
        else { mainOverlay.style.display = 'none'; isPaused = false; gameStarted = true; }
    }

    function triggerCheckpoint() {
        inQuiz = true; isPaused = true; batchCount = 0;
        mainOverlay.style.display = 'flex'; showScreen('screenQuiz'); showQuestion();
    }

    function showQuestion() {
        if (currentQuestionIndex >= currentQuestionSet.length) { arriving = true; resumeGame(); return; }
        firstAttempt = true;
        const q = currentQuestionSet[currentQuestionIndex];
        document.getElementById('qText').innerHTML = `<span style="color:var(--primary-blue)">SYSTEM SYNC...</span><br>Q${currentQuestionIndex + 1}: ${q.q}`;
        const container = document.getElementById('optionsContainer'); container.innerHTML = '';
        q.a.forEach((opt, i) => {
            const btn = document.createElement('button'); btn.className = 'option-btn'; btn.innerText = opt;
            btn.onclick = () => handleAnswer(i); container.appendChild(btn);
        });
    }

    function handleAnswer(idx) {
        const qData = currentQuestionSet[currentQuestionIndex];
        const isCorrect = (idx === qData.correct);

        if (firstAttempt) {
            questionLogs[currentQuestionIndex] = isCorrect ? "CORRECT" : "WRONG";
            firstChoiceLogs[currentQuestionIndex] = qData.a[idx] || "EMPTY_CHOICE";
        }

        if (isCorrect) {
            if (firstAttempt) { syncScore++; }
            feedbackMsg.innerText = "✓ DATA VALIDATED"; feedbackMsg.className = "correct"; feedbackMsg.style.display = "block";
            stability = Math.round((syncScore / currentQuestionSet.length) * 100);
            stabText.innerText = stability;
            currentQuestionIndex++; batchCount++;
            setTimeout(() => {
                feedbackMsg.style.display = "none";
                if (batchCount < 5 && currentQuestionIndex < currentQuestionSet.length) { showQuestion(); } 
                else { resumeGame(); }
            }, 800);
        } else {
            if (firstAttempt) {
                firstAttempt = false;
                stability = Math.round((syncScore / currentQuestionSet.length) * 100);
                stabText.innerText = stability;
            }
            feedbackMsg.innerText = "✗ SYSTEM LOCK: MISMATCH DETECTED"; feedbackMsg.className = "wrong"; feedbackMsg.style.display = "block";
            
            currentQuestionIndex++; batchCount++;
            setTimeout(() => {
                feedbackMsg.style.display = "none";
                if (batchCount < 5 && currentQuestionIndex < currentQuestionSet.length) { showQuestion(); } 
                else { resumeGame(); }
            }, 1200);
        }
    }

    function resumeGame() {
        inQuiz = false; isPaused = false; mainOverlay.style.display = 'none';
        nextMilestone += 1000;
        if (currentQuestionIndex >= currentQuestionSet.length) {
            arriving = true;
            finalLoggedStability = stability;
            finalLoggedSyncScore = syncScore;
        }
    }

    function processValidation() {
        const modKey = document.getElementById('trainingModule').value;
        const siteKey = document.getElementById('playerSite').value;
        
        const completionCode = `${playerIDValue}-${finalLoggedStability}-${finalLoggedSyncScore}`;
        const genBtn = document.getElementById('genBtn'); genBtn.innerText = "SYNCING DATA..."; genBtn.disabled = true;

        for (let i = 0; i < currentQuestionSet.length; i++) {
            if (!questionLogs[i]) questionLogs[i] = "UNANSWERED";
            if (!firstChoiceLogs[i]) firstChoiceLogs[i] = "UNANSWERED";
        }

        // 🌟 LINKED TO YOUR NEW APPSCRIPT DEPLOYMENT URL
        const scriptURL = "https://script.google.com/macros/s/AKfycby1fTqUYJRejskY7D6V1-VIZFmjjkqOqToi77Ef4p_PT2BE-6BgwtAfDaWO60Do7WKD/exec"; 
        
        const hiddenForm = document.createElement("form");
        hiddenForm.method = "POST";
        hiddenForm.action = scriptURL;
        hiddenForm.target = "invisibleFrameChannel"; 

        const payloadField = document.createElement("input");
        payloadField.type = "hidden";
        payloadField.name = "payload";
        payloadField.value = JSON.stringify({ 
            code: completionCode, 
            id: playerIDValue, 
            site: siteKey, 
            stab: finalLoggedStability, 
            sync: finalLoggedSyncScore, 
            total: currentQuestionSet.length, 
            mod: modKey, 
            logs: questionLogs,
            choices: firstChoiceLogs 
        });

        const backgroundPortalReceiver = document.createElement("iframe");
        backgroundPortalReceiver.name = "invisibleFrameChannel";
        backgroundPortalReceiver.style.display = "none";

        const trackingBufferChannel = document.getElementById("trackingBufferChannel");
        trackingBufferChannel.innerHTML = ""; 
        hiddenForm.appendChild(payloadField);
        trackingBufferChannel.appendChild(backgroundPortalReceiver);
        trackingBufferChannel.appendChild(hiddenForm);

        try {
            hiddenForm.submit();
        } catch(e) {
            console.warn("Execution trace exception: ", e);
        }

        setTimeout(() => {
            window.location.href = `${scriptURL}?id=${playerIDValue}&stab=${finalLoggedStability}&sync=${finalLoggedSyncScore}&total=${currentQuestionSet.length}`;
        }, 400);
    }

    function drawAmbulance() {
        let light = (Math.floor(Date.now()/200)%2) ? '#ff3e3e' : '#00d4ff';
        ctx.fillStyle = light; ctx.fillRect(ambulance.x+6, ambulance.y-6, 24, 6);
        ctx.fillStyle = '#fff'; ctx.fillRect(ambulance.x, ambulance.y, ambulance.w, ambulance.h);
        ctx.fillStyle = '#ff3e3e'; ctx.fillRect(ambulance.x, ambulance.y+35, ambulance.w, 12);
        ctx.fillStyle = '#333'; ctx.fillRect(ambulance.x+4, ambulance.y+8, ambulance.w-8, 20);
    }
    function drawCar(car) {
        ctx.fillStyle = car.color; ctx.fillRect(car.x, car.y, car.w, car.h);
        ctx.fillStyle = '#add8e6'; ctx.fillRect(car.x+4, car.y+8, car.w-8, 12);
        ctx.fillStyle = '#fff'; ctx.fillRect(car.x+4, car.y+car.h-6, 4, 3); ctx.fillRect(car.x+car.w-8, car.y+car.h-6, 4, 3);
    }
    function drawHospital() {
        ctx.fillStyle = '#f0f0f0'; ctx.fillRect(10, hospitalY, 340, 500);
        ctx.fillStyle = '#333'; ctx.fillRect(10, hospitalY, 340, 15);
        ctx.fillStyle = '#004a99'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText("ST. LUKE'S MEDICAL CENTER", 180, hospitalY + 45);
    }

    function update() {
        if (isPaused || !gameStarted || inQuiz) return;
        if (arriving) {
            traffic = [];
            if (hospitalY < 20) { hospitalY += 3; roadOffset += 4; } 
            else { if (ambulance.y > 450) { ambulance.y -= 1.5; } else { isPaused = true; document.getElementById('finalStability').innerText = finalLoggedStability + "%"; document.getElementById('finalSync').innerText = `${finalLoggedSyncScore}/${currentQuestionSet.length}`; document.getElementById('finalPlayerDisplay').innerText = "PLAYER ID: " + playerIDValue; showScreen('screenResult'); mainOverlay.style.display = 'flex'; } }
        } else {
            if (keys['ArrowLeft'] && ambulance.x > 15) ambulance.x -= ambulance.speed;
            if (keys['ArrowRight'] && ambulance.x < canvas.width - ambulance.w - 15) ambulance.x += ambulance.speed;
            distance += 4; roadOffset += 12;
            if (distance >= nextMilestone && currentQuestionIndex < currentQuestionSet.length) triggerCheckpoint();
            spawnTimer++;
            if (spawnTimer > 40) {
                const colors = ['#f39c12', '#8e44ad', '#27ae60', '#d35400'];
                traffic.push({ x: Math.random()*(canvas.width-50) + 10, y: -100, w: 34, h: 65, speed: 5 + Math.random()*2, color: colors[Math.floor(Math.random()*4)] });
                spawnTimer = 0;
            }
            for (let i = traffic.length-1; i >= 0; i--) {
                traffic[i].y += traffic[i].speed;
                if (ambulance.x < traffic[i].x + traffic[i].w && ambulance.x + ambulance.w > traffic[i].x && ambulance.y < traffic[i].y + traffic[i].h && ambulance.y + ambulance.h > traffic[i].y) { distance = Math.max(0, distance - 100); traffic.splice(i, 1); } else if (traffic[i].y > canvas.height) traffic.splice(i, 1);
            }
        }
        distText.innerText = Math.floor(distance);
        progBar.style.width = (currentQuestionIndex / currentQuestionSet.length * 100) + "%";
    }

    function draw() {
        ctx.clearRect(0,0, canvas.width, canvas.height); ctx.fillStyle = '#222'; ctx.fillRect(0,0, canvas.width, canvas.height);
        ctx.strokeStyle = '#f1c40f'; ctx.setLineDash([40, 40]); ctx.lineDashOffset = -roadOffset; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(canvas.width/2, 0); ctx.lineTo(canvas.width/2, canvas.height); ctx.stroke();
        if (arriving) drawHospital(); traffic.forEach(drawCar); drawAmbulance(); requestAnimationFrame(draw);
    }
    
    initializeCloudAssets();
    setInterval(update, 1000/60); draw();
</script>
</body>
</html>
